# Defaults of the hardened image: runs as non-root with a read-only root filesystem.
# Everything nginx writes goes to /tmp (the prefix, -p /tmp/): pid, temp files.
# Logs go to stderr/stdout. Same layout as the official image: put servers into
# /etc/nginx/conf.d/*.conf (http context) and main-context directives into
# /etc/nginx/conf.d/*.main.

pid /tmp/nginx.pid;
error_log stderr notice;
pcre_jit on;

# dynamic modules of the image variant (geoip2: /etc/nginx/modules/geoip2.conf)
include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}

include /etc/nginx/conf.d/*.main;
