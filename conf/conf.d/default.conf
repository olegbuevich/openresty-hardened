# Default server on 8080 (non-root: no ports below 1024). Replace or remove this file.
server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    location / {
        root /usr/local/openresty/nginx/html;
        index index.html index.htm;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/local/openresty/nginx/html;
    }
}
