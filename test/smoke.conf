# Smoke test server (test/smoke.sh): Lua, cjson, PCRE JIT, TLS.
server {
    listen 8081;
    listen 8443 ssl;
    ssl_certificate /test/tls.crt;
    ssl_certificate_key /test/tls.key;

    location = /lua {
        content_by_lua_block {
            local cjson = require "cjson"
            local m = ngx.re.match("abc-123", [[(\d+)]], "jo")
            ngx.say(cjson.encode({ ok = true, re = m and m[1], ssl = ngx.var.https }))
        }
    }
}
