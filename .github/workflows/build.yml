# Builds, tests and scans both variants on pushes to master and pull requests. Only a
# release tag vX.Y.Z.W-N publishes: X.Y.Z.W-N, X.Y.Z.W and latest
# (variant geoip2: the same tags with the -geoip2 suffix). Published images are multi-arch
# (amd64, arm64), carry an SBOM and provenance attestation and are signed with cosign
# (keyless, GitHub OIDC).
name: build

on:
  push:
    branches: [master]
    # only release tags vX.Y.Z.W-N (OpenResty version - image revision); others do not build
    tags: ["v[0-9]+.[0-9]+.[0-9]+.[0-9]+-[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A release tag must name the OpenResty version of the Dockerfile; otherwise nothing is
  # built or published.
  tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the OpenResty version
        run: |
          version=$(sed -n 's|^FROM openresty/openresty:\([0-9.]*\)-alpine@.*|\1|p' Dockerfile)
          if ! echo "$GITHUB_REF_NAME" | grep -Eq "^v${version//./\\.}-[0-9]+\$"; then
            echo "::error::tag $GITHUB_REF_NAME does not match OpenResty $version (want v$version-N)"
            exit 1
          fi

  image:
    needs: tag
    # the tag job is skipped for branches and pull requests
    if: ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            suffix: ""
          - variant: geoip2
            suffix: -geoip2
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (amd64, for the tests)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/amd64
          load: true
          tags: test:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      - name: Smoke test
        run: test/smoke.sh test:${{ matrix.variant }} ${{ matrix.variant }}

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: test:${{ matrix.variant }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # also on the multi-arch index: GHCR shows the description of the index
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=match,pattern=^v(.*)$,group=1
            type=match,pattern=^v(\d+\.\d+\.\d+\.\d+)-\d+$,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=openresty-hardened${{ matrix.suffix }}
            org.opencontainers.image.description=OpenResty on distroless: non-root, read-only root filesystem, no shell${{ matrix.variant == 'geoip2' && ', with ngx_http_geoip2_module' || '' }}
            org.opencontainers.image.licenses=BSD-2-Clause
          annotations: |
            org.opencontainers.image.description=OpenResty on distroless: non-root, read-only root filesystem, no shell${{ matrix.variant == 'geoip2' && ', with ngx_http_geoip2_module' || '' }}
            org.opencontainers.image.licenses=BSD-2-Clause

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Build and push (amd64, arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.variant }}

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        if: env.PUBLISH == 'true'

      - name: Sign
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
