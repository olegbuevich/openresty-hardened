# Weekly vulnerability scan of the published images; results go to the Security tab
# (code scanning). A finding means: rebuild (new base digests) or a new OpenResty release.
name: scan

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload SARIF
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, latest-geoip2]
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ matrix.tag }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: trivy.sarif
          category: ${{ matrix.tag }}
